name: Onyx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  onyx:
    name: Typecheck, layers, lint, Onyx unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the bundled Copilot test fixtures are in LFS and nothing here reads them.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup system services
        run: |
          set -e
          # Chromium's namespace sandbox needs unprivileged user namespaces, which
          # Ubuntu 24.04 restricts by default; the unit tests run in Electron.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libsecret-1-dev \
            libgbm1 \
            rpm
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      # node_modules is the slowest step by far and only changes with the lockfile.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            extensions/*/node_modules
            remote/node_modules
            remote/web/node_modules
          key: onyx-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'build/package-lock.json', 'remote/package-lock.json', 'remote/web/package-lock.json', '.nvmrc') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Type check
        run: npm run typecheck-client

      - name: Layer check
        run: npm run valid-layers-check

      - name: Lint Onyx sources
        run: npx eslint src/vs/platform/onyxRuntime src/vs/workbench/contrib/onyx test/onyx

      - name: Stylelint
        run: npm run stylelint

      - name: Compile
        run: npm run compile

      - name: Onyx unit tests
        run: ./scripts/test.sh --grep Onyx
        env:
          DISPLAY: ':10'

      # The full end-to-end run: two mock runtimes (Ollama and LM Studio
      # flavored) plus a real workbench under Xvfb. It drives chat, tools,
      # autocomplete, the model library, commit messages, review, both code
      # actions, staged edits (Onyx Changes), the gated terminal tool, the
      # offline docs mirror, playbooks, run resume, the refactor engine, the
      # repo benchmark, speculative decoding and the architecture map — 45
      # checks asserted on the run journal and the live DOM.
      - name: Onyx end-to-end
        run: node test/onyx/run-e2e.mts
        env:
          DISPLAY: ':10'

      # The deterministic half of the benchmark harness: retrieval, the
      # architecture scan, the edit parsers, the staged-hunk algebra and the
      # terminal classifier, measured against this repository. --skip-models
      # leaves out the sections that need a local model runtime; those skip
      # gracefully anyway, but being explicit keeps CI honest about what it
      # actually measured.
      - name: Onyx benchmarks (pure logic)
        run: node test/onyx/run-benchmarks.mts --skip-models

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-e2e-logs
          path: |
            /tmp/onyx-e2e-*/**/*.log
            /tmp/onyx-e2e-*/user-data/User/workspaceStorage/**/onyx/journal/**
          if-no-files-found: ignore
          retention-days: 7
