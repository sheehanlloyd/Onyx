name: Onyx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Scoped hygiene (A6): NUL bytes in Onyx text files, the old repository
  # name anywhere in the tree, a developer home path in anything Onyx ships,
  # URLs outside the allowlist in the four identity files, and every file
  # under docs/images/ listed in docs/images/MANIFEST.md with its provenance.
  # Needs no dependencies: the checker uses only Node built-ins, and the
  # fixture test proves it fails on a deliberately injected NUL.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Hygiene check
        run: node test/onyx/run-hygiene.mts

      - name: Hygiene check fails on injected defects (fixtures)
        run: node --test test/onyx/checks/hygiene.test.mts

  onyx:
    name: Typecheck, layers, lint, Onyx unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the bundled Copilot test fixtures are in LFS and nothing here reads them.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup system services
        run: |
          set -e
          # Chromium's namespace sandbox needs unprivileged user namespaces, which
          # Ubuntu 24.04 restricts by default; the unit tests run in Electron.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libsecret-1-dev \
            libgbm1 \
            rpm
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      # node_modules is the slowest step by far and only changes with the
      # lockfile. The paths are every directory build/npm/dirs.ts installs
      # into (the v1 key cached five of them and lost extensions/node_modules
      # and the nested server/test trees; A7).
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            build/*/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/*/server/node_modules
            remote/node_modules
            remote/*/node_modules
            test/*/node_modules
            test/integration/*/node_modules
          key: onyx-node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'build/package-lock.json', 'remote/package-lock.json', 'remote/web/package-lock.json', 'build/npm/dirs.ts', '.nvmrc') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          # @vscode/ripgrep downloads its binary through the GitHub releases
          # API, which answers 403 to anonymous calls from a busy runner IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What the cache restored, and what postinstall generates outside it.
      # Printed before anything consumes them so a warm-cache failure can be
      # read off the log instead of guessed at (A7).
      - name: Inventory of restored dependencies
        run: |
          echo "cache hit: ${{ steps.cache-node-modules.outputs.cache-hit }}"
          for artifact in node_modules/.postinstall-state .build/typings/electron.d.ts build/node_modules extensions/node_modules remote/node_modules; do
            if [ -e "$artifact" ]; then echo "present  $artifact"; else echo "MISSING  $artifact"; fi
          done

      # The cache holds node_modules directories only. postinstall also writes
      # .build/typings/electron.d.ts, which src/tsconfig.base.json maps the
      # `electron` module to, and a cache hit skips postinstall: that is why
      # the warm runs on main failed at typecheck (A7). Regenerate what the
      # cache cannot hold, and reinstall outright if the restored tree has no
      # postinstall state at all.
      - name: Regenerate what the cache does not hold
        run: |
          missing=$(node --input-type=module -e "
            import fs from 'node:fs';
            import { dirs } from './build/npm/dirs.ts';
            const missing = dirs.filter(dir => fs.existsSync((dir ? dir + '/' : '') + 'package.json') && !fs.existsSync((dir ? dir + '/' : '') + 'node_modules'));
            if (!fs.existsSync('node_modules/.postinstall-state')) { missing.unshift('node_modules/.postinstall-state'); }
            console.log(missing.join(' '));
          ")
          if [ -n "$missing" ]; then
            echo "restored dependencies are incomplete ($missing); reinstalling"
            npm ci
          fi
          node build/npm/electronTypes.ts
          test -f .build/typings/electron.d.ts
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck-client

      - name: Layer check
        run: npm run valid-layers-check

      - name: Lint Onyx sources
        run: npx eslint src/vs/platform/onyxRuntime src/vs/workbench/contrib/onyx test/onyx

      - name: Stylelint
        run: npm run stylelint

      - name: Compile
        run: npm run compile

      - name: Onyx unit tests
        run: ./scripts/test.sh --grep Onyx
        env:
          DISPLAY: ':10'

      # The full end-to-end run: two mock runtimes (Ollama and LM Studio
      # flavored) plus a real workbench under Xvfb. It drives chat, tools,
      # autocomplete, the model library, commit messages, review, both code
      # actions, staged edits (Onyx Changes), the gated terminal tool, the
      # offline docs mirror, playbooks, run resume, the refactor engine, the
      # repo benchmark, speculative decoding and the architecture map — 45
      # checks asserted on the run journal and the live DOM. It runs on every
      # push and pull request (A7): the editor is driven through commands,
      # Quick Open, DOM focus and the keyboard, never through synthesized
      # mouse clicks at coordinates, and the keybindings it presses are the
      # platform's own (Ctrl on this runner, ⌘ on macOS).
      - name: Onyx end-to-end
        run: node test/onyx/run-e2e.mts
        env:
          DISPLAY: ':10'

      # The deterministic half of the benchmark harness: retrieval, the
      # architecture scan, the edit parsers, the staged-hunk algebra and the
      # terminal classifier, measured against this repository. --skip-models
      # leaves out the sections that need a local model runtime; those skip
      # gracefully anyway, but being explicit keeps CI honest about what it
      # actually measured. Every safety invariant it measures is also an
      # assertion: a marker leak, a fuzz crash, a hunk round-trip failure or a
      # miss on the labelled command set exits non-zero (A7, R-23).
      - name: Onyx benchmarks (pure logic)
        run: node test/onyx/run-benchmarks.mts --skip-models

      # The harness's own checks: the A1 inventory (R-37), the hygiene
      # fixtures, the launch-script path (A4), the asserting benchmark against
      # an injected parser leak (R-23) and the fresh-output protocol (R-35,
      # which transpiles twice and runs a probe test under Xvfb). One file at
      # a time: R-35 rewrites out/ while it runs, and R-23 reads out/.
      - name: Harness self-checks
        run: node --test --test-concurrency=1 "test/onyx/checks/*.test.mts"
        env:
          DISPLAY: ':10'

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-e2e-logs
          path: |
            /tmp/onyx-e2e-*/**/*.log
            /tmp/onyx-e2e-*/user-data/User/workspaceStorage/**/onyx/journal/**
          if-no-files-found: ignore
          retention-days: 7
