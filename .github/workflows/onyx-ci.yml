name: Onyx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      module:
        description: Run the module gate for this module (1 to 5) in addition to the usual jobs; empty runs only the usual jobs
        required: false
        default: ''

jobs:
  # Scoped hygiene (A6): NUL bytes in Onyx text files, the old repository
  # name anywhere in the tree, a developer home path in anything Onyx ships,
  # URLs outside the allowlist in the four identity files, and every file
  # under docs/images/ listed in docs/images/MANIFEST.md with its provenance.
  # Needs no dependencies: the checker uses only Node built-ins, and the
  # fixture test proves it fails on a deliberately injected NUL.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Hygiene check
        run: node test/onyx/run-hygiene.mts

      - name: Hygiene check fails on injected defects (fixtures)
        run: node --test test/onyx/checks/hygiene.test.mts

  onyx:
    name: Typecheck, layers, lint, Onyx unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the bundled Copilot test fixtures are in LFS and nothing here reads them.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup system services
        run: |
          set -e
          # Chromium's namespace sandbox needs unprivileged user namespaces, which
          # Ubuntu 24.04 restricts by default; the unit tests run in Electron.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libsecret-1-dev \
            libgbm1 \
            rpm
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      # pnpm comes from corepack, which ships with Node 24 and reads the
      # version from `packageManager` in package.json, so the pin lives in one
      # place. build/npm/preinstall.ts refuses any other package manager or
      # version.
      - name: Setup pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # The cache holds pnpm's content-addressed store, never node_modules.
      # The install below always runs, so its postinstall always runs too: a
      # warm cache only spares the downloads and the native builds the store
      # already holds. The npm workflow cached node_modules and skipped the
      # install on a hit, which is why it needed a step to regenerate what
      # postinstall writes outside node_modules (A7); that failure mode is
      # gone, and so is the step. An older store is restored when the
      # lockfiles change, and pnpm fetches only what it lacks.
      - name: Cache pnpm store
        id: cache-pnpm-store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: onyx-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm${{ steps.pnpm.outputs.version }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'build/pnpm-lock.yaml', 'build/pnpm-workspace.yaml', 'remote/pnpm-lock.yaml', 'remote/pnpm-workspace.yaml') }}
          restore-keys: |
            onyx-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm${{ steps.pnpm.outputs.version }}-

      # Frozen, always: an unfrozen install rewrites pnpm-lock.yaml in place
      # and is refused by the release-age policy in pnpm-workspace.yaml (A9).
      # `pnpm_config_frozen_lockfile` carries the setting into the installs
      # that postinstall runs in build/ and remote/.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          pnpm_config_frozen_lockfile: 'true'
          GIT_LFS_SKIP_SMUDGE: '1'
          # The suites attach to the workbench's own Electron; nothing here
          # uses the Chromium that @playwright/browser-chromium would fetch.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # @vscode/ripgrep downloads its binary through the GitHub releases
          # API, which answers 403 to anonymous calls from a busy runner IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A store restored from an older lockfile keeps packages nothing uses
      # any more; drop them before the cache step saves it under the new key.
      - name: Prune the pnpm store
        if: steps.cache-pnpm-store.outputs.cache-hit != 'true'
        run: pnpm store prune

      # What the install produced, printed before anything consumes it, so a
      # warm-cache failure can be read off the log instead of guessed at (A7).
      # The lockfiles must be exactly as committed: a frozen install that
      # changed one is a broken install.
      - name: Inventory of installed dependencies
        run: |
          echo "node $(node --version), pnpm ${{ steps.pnpm.outputs.version }}"
          echo "store cache hit: ${{ steps.cache-pnpm-store.outputs.cache-hit }} (${{ steps.pnpm.outputs.store }})"
          missing=0
          for artifact in node_modules/.modules.yaml build/node_modules/.modules.yaml remote/node_modules/.modules.yaml extensions/node_modules .build/typings/electron.d.ts; do
            if [ -e "$artifact" ]; then echo "present  $artifact"; else echo "MISSING  $artifact"; missing=1; fi
          done
          git diff --exit-code --stat -- pnpm-lock.yaml build/pnpm-lock.yaml remote/pnpm-lock.yaml
          exit $missing

      - name: Type check
        run: pnpm run typecheck-client

      - name: Layer check
        run: pnpm run valid-layers-check

      # Upstream replaced ESLint with oxlint in 1.147.0. oxlint.config.ts
      # converts eslint.config.js, so the same rules run under the same names,
      # the local plugin and the header rule included.
      - name: Lint Onyx sources
        run: pnpm run oxlint src/vs/platform/onyxRuntime src/vs/workbench/contrib/onyx test/onyx

      - name: Stylelint
        run: pnpm run stylelint

      - name: Compile
        run: pnpm run compile

      - name: Onyx unit tests
        run: ./scripts/test.sh --grep Onyx
        env:
          DISPLAY: ':10'

      # The full end-to-end run: two mock runtimes (Ollama and LM Studio
      # flavored) plus a real workbench under Xvfb. It drives chat, tools,
      # autocomplete, the model library, commit messages, review, both code
      # actions, staged edits (Onyx Changes), the gated terminal tool, the
      # offline docs mirror, playbooks, run resume, the refactor engine, the
      # repo benchmark, speculative decoding and the architecture map — 58
      # checks asserted on the run journal and the live DOM. It runs on every
      # push and pull request (A7): the editor is driven through commands,
      # Quick Open, DOM focus and the keyboard, never through synthesized
      # mouse clicks at coordinates, and the keybindings it presses are the
      # platform's own (Ctrl on this runner, ⌘ on macOS).
      - name: Onyx end-to-end
        run: node test/onyx/run-e2e.mts
        env:
          DISPLAY: ':10'

      # The deterministic half of the benchmark harness: retrieval, the
      # architecture scan, the edit parsers, the staged-hunk algebra and the
      # terminal classifier, measured against this repository. --skip-models
      # leaves out the sections that need a local model runtime; those skip
      # gracefully anyway, but being explicit keeps CI honest about what it
      # actually measured. Every safety invariant it measures is also an
      # assertion: a marker leak, a fuzz crash, a hunk round-trip failure or a
      # miss on the labelled command set exits non-zero (A7, R-23).
      - name: Onyx benchmarks (pure logic)
        run: node test/onyx/run-benchmarks.mts --skip-models

      # The harness's own checks: the A1 inventory (R-37), the hygiene
      # fixtures, the launch-script path (A4), the asserting benchmark against
      # an injected parser leak (R-23) and the fresh-output protocol (R-35,
      # which transpiles twice and runs a probe test under Xvfb). One file at
      # a time: R-35 rewrites out/ while it runs, and R-23 reads out/.
      - name: Harness self-checks
        run: node --test --test-concurrency=1 "test/onyx/checks/*.test.mts"
        env:
          DISPLAY: ':10'

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-e2e-logs
          path: |
            /tmp/onyx-e2e-*/**/*.log
            /tmp/onyx-e2e-*/user-data/User/workspaceStorage/**/onyx/journal/**
          if-no-files-found: ignore
          retention-days: 7

  # Module gate on demand (A12, DEC-11): one command proves a module. Runs on
  # macOS so the packaged checks are not skipped: it builds the app the way a
  # release does, points the gate at it, and uploads the results file. Dispatch
  # with the `module` input; the job is absent from push and PR runs.
  module-gate:
    name: Module gate (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.module != ''
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: |
          corepack enable pnpm
          pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # Frozen, and frozen in the build/ and remote/ installs that postinstall
      # runs (see the `onyx` job above).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          pnpm_config_frozen_lockfile: 'true'
          GIT_LFS_SKIP_SMUDGE: '1'
          # The suites attach to the workbench's own Electron; nothing here
          # uses the Chromium that @playwright/browser-chromium would fetch.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the packaged app
        run: pnpm run gulp vscode-darwin-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile built-in extensions for the end-to-end suite
        run: pnpm run compile

      - name: Fresh output stamp
        run: node test/onyx/run-fresh.mts --stamp-only

      - name: Module gate
        run: node test/onyx/run-module-gate.mts --module ${{ inputs.module }}
        env:
          ONYX_PACKAGED_APP: ../VSCode-darwin-arm64/Onyx.app
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-gate-module-${{ inputs.module }}
          path: docs/progress/gate-module-${{ inputs.module }}.json
          if-no-files-found: ignore
          retention-days: 90
