name: Onyx packaged smoke

# The packaged-app harness (A8): builds the macOS app the way a release does
# and drives it against the mock runtime. Baseline mode must pass. Release
# mode fails until B1 and B3 land and is recorded as the named baseline
# exception, never as a pass; B3 makes it a required check. Runs on demand,
# on release-candidate branches, and on a pull request that changes the
# harness itself.
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/onyx-packaged.yml
      - test/onyx/run-packaged-smoke.mts
      - test/onyx/mock-ollama.mts

jobs:
  packaged:
    name: Build the app and run the smoke (macOS, Apple silicon)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the packaged app
        run: npm run gulp vscode-darwin-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packaged smoke, baseline mode (must pass)
        run: node test/onyx/run-packaged-smoke.mts --app ../VSCode-darwin-arm64/Onyx.app --mode baseline --json-out smoke-baseline.json

      # Expected to fail until B1 and B3: the step records the failure and the
      # observed inventory instead of hiding it. `continue-on-error` keeps the
      # job green only because the module gate names this as an owned baseline
      # exception; B3 removes it.
      - name: Packaged smoke, release mode (baseline exception, owner B1 and B3)
        continue-on-error: true
        run: node test/onyx/run-packaged-smoke.mts --app ../VSCode-darwin-arm64/Onyx.app --mode release --json-out smoke-release.json

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-packaged-smoke
          path: |
            smoke-baseline.json
            smoke-release.json
          if-no-files-found: ignore
          retention-days: 14
