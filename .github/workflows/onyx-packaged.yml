name: Onyx packaged smoke

# The packaged-app harness (A8): builds the macOS app the way a release does
# and drives it against the mock runtime. Both modes must pass. Release mode
# is the tool contract on the real artifact: the six essential tools within
# eight slots, the exact default inventory and the network opt-in's (R-05),
# read → staged edit → accept (R-31), per-invocation approval (B2), and no
# Agent Host. It was a named baseline exception until B1 and B3 landed; B3
# made it required. Runs on demand, on release-candidate branches, and on a
# pull request that changes the harness, the product's Onyx sources or the
# capability contract.
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/onyx-packaged.yml
      - test/onyx/run-packaged-smoke.mts
      - test/onyx/mock-ollama.mts
      - src/vs/workbench/contrib/onyx/**
      - src/vs/platform/onyxRuntime/**
      - src/vs/platform/windows/electron-main/windowsMainService.ts
      - product.json

jobs:
  packaged:
    name: Build the app and run the smoke (macOS, Apple silicon)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from corepack, which reads the version from `packageManager`
      # in package.json; build/npm/preinstall.ts refuses anything else.
      - name: Setup pnpm
        run: |
          corepack enable pnpm
          pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # Frozen, and frozen in the build/ and remote/ installs that postinstall
      # runs: an unfrozen install rewrites the lockfile in place (A9).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          pnpm_config_frozen_lockfile: 'true'
          GIT_LFS_SKIP_SMUDGE: '1'
          # The suites attach to the workbench's own Electron; nothing here
          # uses the Chromium that @playwright/browser-chromium would fetch.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the packaged app
        run: pnpm run gulp vscode-darwin-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packaged smoke, baseline mode (must pass)
        run: node test/onyx/run-packaged-smoke.mts --app ../VSCode-darwin-arm64/Onyx.app --mode baseline --json-out smoke-baseline.json

      # The smoke reads the reviewed tool contract from transpiled output, the
      # same module the app was just built from, to check the inventory (R-05).
      - name: Transpile for the contract check
        run: pnpm run transpile-client

      - name: Packaged smoke, release mode (must pass)
        run: node test/onyx/run-packaged-smoke.mts --app ../VSCode-darwin-arm64/Onyx.app --mode release --json-out smoke-release.json

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-packaged-smoke
          path: |
            smoke-baseline.json
            smoke-release.json
            smoke-baseline-abort.png
            smoke-release-abort.png
          if-no-files-found: ignore
          retention-days: 14
