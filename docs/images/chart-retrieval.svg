<svg xmlns="http://www.w3.org/2000/svg" width="720" height="162" viewBox="0 0 720 162" role="img" aria-label="Finding the right file from a plain-English question">
  <title>Finding the right file from a plain-English question</title>
  <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a">Finding the right file from a plain-English question</text>
  <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">10 questions about this repository, asking for the file that actually implements the answer</text>
  <g>
    <text x="0" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Onyx BM25 index</text>
    <text x="0" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">correct file in the top 5 · 7.65 ms per query</text>
    <rect x="210" y="66" width="398" height="18" rx="4" fill="rgba(124, 92, 255, 0.18)"/>
    <rect x="210" y="66" width="358.2" height="18" rx="4" fill="#7c5cff"/>
    <text x="618" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#7c5cff">90%</text>
  </g>
  <g>
    <text x="0" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Substring search</text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">what an agent without an index falls back to</text>
    <rect x="210" y="108" width="398" height="18" rx="4" fill="rgba(139, 148, 158, 0.22)"/>
    <rect x="210" y="108" width="2" height="18" rx="4" fill="#8b949e"/>
    <text x="618" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#8b949e">0%</text>
  </g>
</svg>
