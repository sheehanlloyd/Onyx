<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-label="Surviving what small local models actually emit">
  <title>Surviving what small local models actually emit</title>
  <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a">Surviving what small local models actually emit</text>
  <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Nine malformed edit shapes observed from qwen2.5-coder and llama3.2, plus 5,000 fuzzed inputs</text>
  <g>
    <text x="0" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Malformed edits recovered</text>
    <text x="0" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">short markers, missing dividers, fences, truncation, CR line endings</text>
    <rect x="210" y="66" width="398" height="18" rx="4" fill="rgba(124, 92, 255, 0.18)"/>
    <rect x="210" y="66" width="398" height="18" rx="4" fill="#7c5cff"/>
    <text x="618" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#7c5cff">100</text>
  </g>
  <g>
    <text x="0" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Files corrupted by a marker</text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">a marker written into your file is the failure that matters</text>
    <rect x="210" y="108" width="398" height="18" rx="4" fill="rgba(139, 148, 158, 0.22)"/>
    <rect x="210" y="108" width="2" height="18" rx="4" fill="#8b949e"/>
    <text x="618" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#8b949e">0</text>
  </g>
  <g>
    <text x="0" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Fuzz crashes</text>
    <text x="0" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">over 5000 random inputs</text>
    <rect x="210" y="150" width="398" height="18" rx="4" fill="rgba(139, 148, 158, 0.22)"/>
    <rect x="210" y="150" width="2" height="18" rx="4" fill="#8b949e"/>
    <text x="618" y="164" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#8b949e">0</text>
  </g>
</svg>
