<svg xmlns="http://www.w3.org/2000/svg" width="720" height="162" viewBox="0 0 720 162" role="img" aria-label="Speculative decoding, measured instead of assumed">
  <title>Speculative decoding, measured instead of assumed</title>
  <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a">Speculative decoding, measured instead of assumed</text>
  <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">qwen2.5-coder-7b-instruct generating the identical prompt, loaded plain and loaded with a draft model</text>
  <g>
    <text x="0" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">No draft model</text>
    <text x="0" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">the target on its own</text>
    <rect x="210" y="66" width="398" height="18" rx="4" fill="rgba(124, 92, 255, 0.18)"/>
    <rect x="210" y="66" width="346.0869565217392" height="18" rx="4" fill="#7c5cff"/>
    <text x="618" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#7c5cff">48 tok/s</text>
  </g>
  <g>
    <text x="0" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">With a draft model</text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" opacity="0.75">draft qwen2.5-coder-0.5b-instruct</text>
    <rect x="210" y="108" width="398" height="18" rx="4" fill="rgba(139, 148, 158, 0.22)"/>
    <rect x="210" y="108" width="248.15278545349122" height="18" rx="4" fill="#8b949e"/>
    <text x="618" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600" fill="#8b949e">34.4 tok/s</text>
  </g>
</svg>
