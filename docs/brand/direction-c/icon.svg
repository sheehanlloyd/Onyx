<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
	<!-- Direction C, "Split": one whole divided by a seam. Solid half: kept. Faint half, slipped out of line: refused. -->
	<defs>
		<linearGradient id="c-body" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#84243a"/>
			<stop offset="1" stop-color="#5f1526"/>
		</linearGradient>
		<filter id="c-shadow" x="-10%" y="-10%" width="120%" height="124%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
			<feOffset dy="12"/>
			<feComponentTransfer>
				<feFuncA type="linear" slope="0.28"/>
			</feComponentTransfer>
			<feMerge>
				<feMergeNode/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#c-body)" filter="url(#c-shadow)"/>
	<!-- kept: solid half -->
	<path d="M480 232 A240 240 0 0 0 480 712 Z" fill="#f5f0e7"/>
	<!-- refused: faint half, slipped down along the seam -->
	<path d="M544 312 A240 240 0 0 1 544 792 Z" fill="#f5f0e7" fill-opacity="0.42"/>
</svg>
